name: OXZRDP-PRO-V5.7B

on:
  workflow_dispatch:
    inputs:
      pc_name:
        description: 'Nama PC (contoh: OXZRDP-BANGJAGO)'
        required: true
        default: 'OXZRDP-PC'
      username:
        description: 'Username RDP (contoh: bangjago)'
        required: true
        default: 'useroxz'
      password:
        description: 'Password RDP (kosongin = random)'
        required: false
        default: ''

jobs:
  deployment:
    runs-on: windows-latest
    timeout-minutes: 1440

    steps:
      # ============ STEP 1 - RDP + RENAME PC ============
      - name: 1. Enable RDP + Rename PC
        shell: pwsh
        continue-on-error: true
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0 -Force
          netsh advfirewall firewall set rule group='remote desktop' new enable=Yes
          Restart-Service -Name TermService -Force -ErrorAction SilentlyContinue
          
          $pcName = "${{ github.event.inputs.pc_name }}"
          Rename-Computer -NewName $pcName -Force -ErrorAction SilentlyContinue
          Write-Host "[OK] Nama PC: $pcName"

      # ============ STEP 2 - BIKIN USER CUSTOM ============
      - name: 2. Bikin User Custom
        shell: pwsh
        continue-on-error: true
        run: |
          $u = "${{ github.event.inputs.username }}"
          $passInput = "${{ github.event.inputs.password }}"
          
          if ([string]::IsNullOrWhiteSpace($passInput)) {
            $sets = @('ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%')
            $p = ''
            foreach ($s in $sets) { $p += $s[(Get-Random -Maximum $s.Length)] }
            $all = -join $sets
            for ($i = 1; $i -le 11; $i++) { $p += $all[(Get-Random -Maximum $all.Length)] }
          } else {
            $p = $passInput
          }
          
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_USER=$u"
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_PASS=$p"
          Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_PC=$pcName"
          
          net user $u $p /add /y
          net localgroup Administrators $u /add
          net localgroup 'Remote Desktop Users' $u /add
          Write-Host "[OK] User: $u / Pass: $p"

      # ============ STEP 3 - TAILSCALE + INFO + KEEP ALIVE ============
      - name: 3. Tailscale + Info + Keep Alive
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.OXZ_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=NO-KEY"
          } else {
            try {
              $msi = "$env:TEMP\ts.msi"
              Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' -OutFile $msi
              Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/quiet', '/norestart' -Wait
              Start-Sleep -Seconds 5
              
              $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
              if (Test-Path $tsExe) {
                $hostname = "${{ github.event.inputs.pc_name }}"
                & $tsExe up --authkey=$env:TS_AUTHKEY --hostname=$hostname --accept-routes 2>&1 | Write-Host
                
                $ip = $null
                for ($i = 1; $i -le 24; $i++) {
                  Start-Sleep -Seconds 5
                  $ipCheck = & $tsExe ip -4 2>$null
                  if (-not [string]::IsNullOrWhiteSpace($ipCheck)) {
                    $ip = $ipCheck
                    break
                  }
                }
                
                if ([string]::IsNullOrWhiteSpace($ip)) {
                  Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=TAILSCALE-GAGAL"
                } else {
                  Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=$ip"
                }
              }
            } catch {
              Add-Content -Path $env:GITHUB_ENV -Value "OXZRDP_IP=ERROR"
            }
          }
          
          Write-Host ""
          Write-Host "==============================================="
          Write-Host " [ OXZRDP PRO V5.7B - ONLINE ]"
          Write-Host "==============================================="
          Write-Host " NAMA PC    : ${{ github.event.inputs.pc_name }}"
          Write-Host " IP ADDRESS : $env:OXZRDP_IP"
          Write-Host " USERNAME   : $env:OXZRDP_USER"
          Write-Host " PASSWORD   : $env:OXZRDP_PASS"
          Write-Host " DURASI     : 24 JAM"
          Write-Host " VERSI      : V5.7B"
          Write-Host "==============================================="
          Write-Host " Website: https://oxzratxone-official.netlify.app"
          Write-Host " Community: https://chat.whatsapp.com/JxA3IUkILsDLUsx8u5Hnr3"
          Write-Host "==============================================="
          
          $endTime = (Get-Date).AddMinutes(1435)
          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Online | IP: $ip | Sisa: $($remaining.ToString('hh\:mm\:ss'))"
            Start-Sleep -Seconds 300
          }
